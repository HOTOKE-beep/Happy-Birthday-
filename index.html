<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Jasmine 🖤</title>


<link rel="stylesheet" href="style.css">


<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">


</head>


<body>


<!-- Opening Screen -->

<div id="opening-screen">

    <div class="opening-content">

        <h1>
            A Special Surprise 🌸
        </h1>

        <p>
            Tap to begin the journey ✨
        </p>

        <button onclick="startExperience()">
            🎵 Play Music
        </button>

    </div>

</div>



<div class="container">


<div class="card">


<img src="jasmine.jpg" class="profile" alt="Jasmine">


<h1 class="title">
JASMINE
</h1>


<p class="subtitle">
A little universe made with memories ✨
</p>


<button onclick="showWishes()">
Open Surprise 💌
</button>



<div class="message">

<p>
Happy Birthday Jasmine 🌸
<br><br>
Some people become a beautiful chapter
in our memories.
<br><br>
This small creation is a reminder of
those precious moments.
🖤
</p>

</div>



</div>


</div>





<!-- Wishes Scene -->

<div id="wishes-screen">

    <div class="wishes-content">

        <h2>
            A Few Words For You 🌸
        </h2>


        <p id="wish-text"></p>


        <button onclick="nextWish()">
            Next ✨
        </button>


    </div>

</div>

<!-- Final Scene -->

<div id="final-screen">

    <div class="final-content">

        <h1 id="final-title"></h1>

        <p id="final-message"></p>

    </div>

</div>



<audio id="music" loop>

<source src="maula-mere-maula.mp3" type="audio/mpeg">

</audio>



<button class="music-btn">
🎵
</button>



<script src="script.js"></script>


</body>

</html>
